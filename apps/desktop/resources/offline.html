<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visvine</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <!--
      The one page the shell draws itself. It cannot import anything (no bundler,
      and the web app's stylesheet lives on the server we cannot reach), so
      `pnpm tokens:build` writes the design tokens into the block below and the
      rules read them as custom properties. The app is light-only.
    -->
    <style>

      :root {
        --vv-color-surface: #ffffff;
        --vv-color-surface-subtle: rgba(17, 24, 39, 0.025);
        --vv-color-surface-muted: rgba(17, 24, 39, 0.05);
        --vv-color-surface-backdrop: #ffffff;
        --vv-color-surface-glass: rgba(255, 255, 255, 0.82);
        --vv-color-fg: #111827;
        --vv-color-fg-secondary: #374151;
        --vv-color-fg-muted: #4b5563;
        --vv-color-fg-subtle: #9ca3af;
        --vv-color-fg-inverse: #ffffff;
        --vv-color-fg-link: #2563eb;
        --vv-color-line: #d1d5db;
        --vv-color-line-subtle: #e5e7eb;
        --vv-color-accent: #78d870;
        --vv-color-accent-strong: #2f7a3e;
        --vv-color-accent-soft: #eaf9ec;
        --vv-color-brand: #78d870;
        --vv-color-admin: #b4881b;
        --vv-color-danger: #dc2626;
        --vv-color-danger-strong: #b91c1c;
        --vv-color-danger-bright: #ef4444;
        --vv-color-danger-wash: #fef2f2;
        --vv-color-danger-line: #fecaca;
        --vv-color-warning: #b45309;
        --vv-color-warning-strong: #92400e;
        --vv-color-warning-bright: #f59e0b;
        --vv-color-warning-wash: #fffbeb;
        --vv-color-warning-line: #fde68a;
        --vv-color-success: #15803d;
        --vv-color-success-strong: #166534;
        --vv-color-success-bright: #22c55e;
        --vv-color-success-wash: #f0fdf4;
        --vv-color-success-line: #bbf7d0;
        --vv-color-info: #1d4ed8;
        --vv-color-info-strong: #1e40af;
        --vv-color-info-bright: #3b82f6;
        --vv-color-info-wash: #eff6ff;
        --vv-color-info-line: #bfdbfe;
        --vv-color-hue-red: #ef4444;
        --vv-color-hue-red-fg: #b91c1c;
        --vv-color-hue-red-wash: #fef2f2;
        --vv-color-hue-red-line: #fecaca;
        --vv-color-hue-orange: #f97316;
        --vv-color-hue-orange-fg: #c2410c;
        --vv-color-hue-orange-wash: #fff7ed;
        --vv-color-hue-orange-line: #fed7aa;
        --vv-color-hue-amber: #f59e0b;
        --vv-color-hue-amber-fg: #b45309;
        --vv-color-hue-amber-wash: #fffbeb;
        --vv-color-hue-amber-line: #fde68a;
        --vv-color-hue-yellow: #eab308;
        --vv-color-hue-yellow-fg: #a16207;
        --vv-color-hue-yellow-wash: #fefce8;
        --vv-color-hue-yellow-line: #fef08a;
        --vv-color-hue-green: #22c55e;
        --vv-color-hue-green-fg: #15803d;
        --vv-color-hue-green-wash: #f0fdf4;
        --vv-color-hue-green-line: #bbf7d0;
        --vv-color-hue-teal: #14b8a6;

        --vv-color-hue-sky-wash: #f0f9ff;
        --vv-color-hue-sky-line: #bae6fd;
        --vv-color-hue-blue: #3b82f6;
        --vv-color-hue-blue-fg: #1d4ed8;
        --vv-color-hue-blue-wash: #eff6ff;
        --vv-color-hue-blue-line: #bfdbfe;
        --vv-color-hue-indigo: #6366f1;

        --vv-color-hue-gray: #6b7280;
        --vv-color-hue-gray-fg: #374151;
        --vv-color-hue-gray-wash: #f9fafb;
        --vv-color-hue-gray-line: #e5e7eb;
      }
      /* vv-tokens:end */
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--vv-color-surface); color: var(--vv-color-fg);
      }
      .card { text-align: center; max-width: 34rem; padding: 2rem; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--vv-color-brand); margin: 0 auto 1.25rem;
             animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .6 } 50% { transform: scale(1.35); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1 } }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
      p { margin: .25rem 0; color: var(--vv-color-fg-muted); }
      code { font-size: .9em; }
      /* The neutral button Button.tsx draws: a painted rounded square, no border,
         no shadow — a button sits on the page, it doesn't float over it. */
      button {
        margin-top: 1.5rem; padding: .625rem 1rem; border: 0; border-radius: .5rem;
        background: var(--vv-color-surface-subtle); color: var(--vv-color-fg-secondary); cursor: pointer;
        font: inherit; font-size: .875rem; font-weight: 600;
        transition: background-color .15s;
      }
      button:hover { background: var(--vv-color-surface-muted); }
    </style>
  </head>
  <body>
    <main class="card" data-testid="offline">
      <div class="dot"></div>
      <h1>Can't reach Visvine</h1>
      <p>Trying to connect to <code id="url"></code></p>
      <p>The app will open automatically once the server is reachable.</p>
      <button id="retry">Retry now</button>
    </main>
    <script>
      const url = new URLSearchParams(location.search).get("url") || "";
      document.getElementById("url").textContent = url;
      document.getElementById("retry").addEventListener("click", () => { if (url) location.href = url; });
    </script>
  </body>
</html>
