<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visvine</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <!--
      The one page the shell draws itself. Colours repeat src/theme.ts, which is
      the web app's tokens: this file cannot import either (no bundler, and the
      stylesheet lives on the server we cannot reach). tests/theme.test.mjs fails
      if the two drift. The app is light-only, so there is no dark variant.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        background: #ffffff; color: #111827;
      }
      .card { text-align: center; max-width: 34rem; padding: 2rem; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #78d870; margin: 0 auto 1.25rem;
             animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .6 } 50% { transform: scale(1.35); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1 } }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
      p { margin: .25rem 0; color: #6b7280; }
      code { font-size: .9em; }
      /* The neutral button Button.tsx draws: a painted rounded square, no border,
         no shadow — a button sits on the page, it doesn't float over it. */
      button {
        margin-top: 1.5rem; padding: .625rem 1rem; border: 0; border-radius: .5rem;
        background: #f9fafb; color: #374151; cursor: pointer;
        font: inherit; font-size: .875rem; font-weight: 600;
        transition: background-color .15s;
      }
      button:hover { background: #f3f4f6; }
    </style>
  </head>
  <body>
    <main class="card" data-testid="offline">
      <div class="dot"></div>
      <h1>Can't reach Visvine</h1>
      <p>Trying to connect to <code id="url"></code></p>
      <p>The app will open automatically once the server is reachable.</p>
      <button id="retry">Retry now</button>
    </main>
    <script>
      const url = new URLSearchParams(location.search).get("url") || "";
      document.getElementById("url").textContent = url;
      document.getElementById("retry").addEventListener("click", () => { if (url) location.href = url; });
    </script>
  </body>
</html>
