<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visvine</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f6f7f5; color: #1c1f1a;
      }
      @media (prefers-color-scheme: dark) { body { background: #111411; color: #e7eae5; } }
      .card { text-align: center; max-width: 34rem; padding: 2rem; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #78d870; margin: 0 auto 1rem;
             animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .6 } 50% { transform: scale(1.35); opacity: 1 } }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: .25rem 0; opacity: .8; }
      code { font-size: .9em; }
      button {
        margin-top: 1.25rem; padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid currentColor;
        background: transparent; color: inherit; cursor: pointer; font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="card" data-testid="offline">
      <div class="dot"></div>
      <h1>Can't reach Visvine</h1>
      <p>Trying to connect to <code id="url"></code></p>
      <p>The app will open automatically once the server is reachable.</p>
      <button id="retry">Retry now</button>
    </main>
    <script>
      const url = new URLSearchParams(location.search).get("url") || "";
      document.getElementById("url").textContent = url;
      document.getElementById("retry").addEventListener("click", () => { if (url) location.href = url; });
    </script>
  </body>
</html>
