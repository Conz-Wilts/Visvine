org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ─── App configuration (override per-build with -P or in ~/.gradle/gradle.properties) ───
# Backend origin. Android emulator reaches the host machine via 10.0.2.2.
visvine.apiBaseUrl=http://10.0.2.2:3000
# Enables the in-app "Dev login" path (backend must also have ENABLE_DEV_AUTH=true).
visvine.devAuthEnabled=true
# Required only for real Google OAuth (not the dev bypass).
visvine.googleClientId=
