packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ reads these here, NOT from the `pnpm` field in package.json — that
# field is silently ignored, which is how the advisory overrides below stopped
# being applied (and dropped out of the lockfile) the first time this repo was
# installed with a newer pnpm. Keep them in this file.

allowBuilds:
  '@prisma/engines': true
  electron-winstaller: false
  esbuild: true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - electron

# Advisory pins — see commit b8699e7 ("clear every dependency advisory").
overrides:
  '@xmldom/xmldom': ^0.8.13
  linkify-it: ^5.0.2
  nanoid@^3: ^3.3.18
  fast-xml-builder: ^1.1.7
  form-data@^2: ^2.5.6
  lodash: ^4.18.0
  hono: ^4.13.5
  '@hono/node-server': ^1.19.10
  effect: ^3.20.0
  shell-quote: ^1.10.0
  tar: ^7.5.22
  app-builder-lib: ^26.15.3
  builder-util-runtime: ^9.7.0
  js-yaml@^4: ^4.3.2
  brace-expansion@^1: ^1.1.18
  brace-expansion@^5: ^5.0.9
  postcss: ^8.5.26
  deepmerge-ts: ^8.0.2
  '@tootallnate/once': ^2.0.1
  fast-xml-parser: ^5.7.0
  valibot: ^1.4.2
  # miniflare pins sharp 0.35.2 exactly; 0.35.4 fixes GHSA-rgj7-g3m4-5g8c (high).
  sharp@0.35.2: ^0.35.4
  # `apps/web > knip > smol-toml`: GHSA-7w5x-hrqm-74c2 (high), patched in 1.7.1.
  smol-toml: ^1.7.1
  # Reached only as `@prisma/client > prisma > mysql2`, and this deployment is
  # Postgres — but an override costs nothing and an ignore has to be re-read
  # every time the advisory list changes. GHSA-3f6p-5ww8-9rcr (auth plugin
  # downgrade to mysql_clear_password, high) and GHSA-rgwj-5xj2-c3m3 (zlib
  # decompression bomb).
  mysql2: ^3.23.1
  # `apps/desktop > electron-builder > app-builder-lib > ajv > fast-uri`: four
  # host-confusion and SSRF advisories, all patched in 3.1.6. Kept on 3.x — ajv
  # asks for ^3, and the 4.x major is not what it was tested against.
  fast-uri: ^3.1.6

auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq
