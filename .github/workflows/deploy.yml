name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Manual re-run of the exact same pipeline against the current main. The way
  # to redeploy after changing a secret or an env var — which Cloud Run resolves
  # at revision-creation time, so a secret rotated in Secret Manager does not
  # reach production until a new revision is made.
  workflow_dispatch:

# One deploy at a time. Two pushes in quick succession would otherwise race on
# the same Cloud SQL schema and the same traffic split, and the loser could
# leave production pointing at a revision built from the older commit. Queued
# rather than cancelled: a run that has already migrated must be allowed to
# finish routing traffic to the code that migration was for.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT: visvine-platform
  REGION: australia-southeast1
  REGISTRY: australia-southeast1-docker.pkg.dev
  IMAGE: australia-southeast1-docker.pkg.dev/visvine-platform/visvine/web
  SERVICE: visvine-web
  SQL_INSTANCE: visvine-platform:australia-southeast1:visvine-pgdata
  # Not a secret, and not read from Secret Manager: the deploying service
  # account holds secretAccessor on DATABASE_URL only — GCS_MEDIA_BUCKET is
  # resolved by the Cloud Run RUNTIME account through --set-secrets, which is a
  # different grant. The name is already public in GCS_CDN_BASE_URL below.
  MEDIA_BUCKET: visvine-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Names the target so the deploy is recorded against it and gets the
    # environment's secrets and variables. Deployment protection rules (required
    # reviewers, wait timers) need a paid plan for a private repo and are not
    # available here — the canary, the smoke test and the rollback below are what
    # actually stand between a bad commit and users. See docs/runbook.md.
    environment:
      name: Production
      url: https://visvine.com
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # A short, stable id for the revision and the image tag, so a revision in
      # the console can be traced back to a commit without a lookup table. A
      # manual re-run of the same commit — the way an env or secret change
      # reaches production — needs a new revision name, since Cloud Run refuses
      # a second revision with the same name and a different configuration; the
      # run number keeps it unique while the commit stays readable.
      - name: Compute release id
        id: rel
        run: |
          sha8=$(echo ${{ github.sha }} | cut -c1-8)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then sha8="$sha8-r${{ github.run_number }}"; fi
          echo "sha8=$sha8" >> "$GITHUB_OUTPUT"

      # Record what is serving RIGHT NOW, before anything changes. This is the
      # rollback target, and it has to be captured before the deploy because
      # after it there are two revisions and no record of which was good.
      - name: Capture current serving revision
        id: current
        run: |
          rev=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format=json 2>/dev/null \
            | jq -r '[.status.traffic[]? | select((.percent // 0) > 0) | .revisionName] | first // ""')
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${rev:-<none — first deploy>}"

      # ── Build BEFORE touching production ─────────────────────────────────────
      # The image is built and pushed first on purpose. Every step after this
      # mutates production — the database schema, then the traffic split — and a
      # compile error, a failed test fixture or a bad build arg must be caught
      # while production is still entirely untouched. A build that fails here
      # costs a red check; a build that failed after the migration would leave
      # the schema ahead of the code that is still serving.
      - name: Build image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # ── Production changes start here ────────────────────────────────────────

      # An on-demand backup immediately before the schema moves. Cloud SQL's
      # automated backups and PITR are the real safety net (scripts/backup-config.mjs
      # asserts both are on); this is the labelled restore point a human reaches
      # for when a migration did something a migration should not have. Never
      # allowed to fail the deploy — a full backup queue is not a reason to block
      # a release when PITR still covers the window.
      - name: Snapshot the database
        continue-on-error: true
        run: |
          gcloud sql backups create \
            --instance="$(echo "$SQL_INSTANCE" | cut -d: -f3)" \
            --project="$PROJECT" \
            --description="pre-deploy ${{ steps.rel.outputs.sha8 }}" \
            --async

      - name: Sync database schema
        run: |
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 ${{ env.SQL_INSTANCE }} &
          sleep 5
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.PROJECT }})
          # Adapt the unix-socket prod URL (@localhost/db?host=/cloudsql/...) to the TCP proxy.
          if echo "$DB_URL" | grep -q "host=/cloudsql"; then
            DB_URL=$(echo "$DB_URL" | sed -E 's|@[^/]*/([^?]+)\?host=[^[:space:]]*|@127.0.0.1:5432/\1|')
          fi
          corepack enable && corepack prepare pnpm@10.30.2 --activate
          pnpm install --frozen-lockfile
          cd apps/web
          # 1. Repairs a migration can't express, because they depend on the data
          #    that is already there: backfill the NOT-NULL `links.pair_key`,
          #    dedup so the unique index can build, settle duplicate public space
          #    names. Also carries the pre-baseline renames, for a database that
          #    has not had them yet.
          DATABASE_URL="$DB_URL" node scripts/prod-schema-presync.mjs
          # 2. Baseline, once. A database that predates `prisma migrate` has no
          #    record of any migration; without this, deploy would try to build a
          #    schema that is already there. Marks 0_init applied and nothing
          #    else, and only when the record is empty, so it is a no-op forever
          #    after. Deleting the tracking table is what would undo it.
          DATABASE_URL="$DB_URL" node scripts/baseline-migrations.mjs
          # 3. Replay any migration prod has not run. Unlike `db push` this
          #    executes SQL that was written and reviewed, so a rename stays a
          #    rename instead of being inferred as drop + create.
          DATABASE_URL="$DB_URL" pnpm dlx prisma@7.4.0 migrate deploy
          # 4. Apply the hand-written SQL Prisma can't express (HNSW, GIN, partial
          #    expression indexes). Must run AFTER the migrations, which own every
          #    index schema.prisma does describe.
          DATABASE_URL="$DB_URL" node scripts/apply-sql-functions.mjs
          # No seeding: production data is managed in the app, never by deploys.

      # ── Release: candidate first, traffic only after it answers ──────────────

      # --no-traffic is the whole point. The revision starts, warms, and is
      # reachable on its own tagged URL while every real user is still being
      # served by the previous one. Nothing below can break production for a user
      # until the traffic step, which only runs if the smoke test passed.
      - name: Deploy candidate revision (no traffic)
        run: |
          # OPENROUTER_API_KEY is deliberately NOT passed. The secret exists
          # and holds a real key; withholding it from the runtime is how the
          # deployment's AI is held off, because every path already treats a
          # missing key as "off" rather than degrading — the nightly embed and
          # memory sweeps do their orphan prune and skip their extraction, the
          # query-time catch-up does nothing, and search answers
          # `semantic: "no-key"` and serves its keyword stages. Turning it on
          # is adding `,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest` back
          # here and running `pnpm db:embed` once to backfill.
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --revision-suffix=${{ steps.rel.outputs.sha8 }} \
            --no-traffic \
            --tag=candidate \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=visvine-cloudrun@${{ env.PROJECT }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,SUPER_ADMIN_EMAILS=SUPER_ADMIN_EMAILS:latest,GCS_MEDIA_BUCKET=GCS_MEDIA_BUCKET:latest,GCS_RESOURCES_BUCKET=GCS_RESOURCES_BUCKET:latest,SECRETS_KEY=SECRETS_KEY:latest,EDGE_SERVICE_TOKEN=EDGE_SERVICE_TOKEN:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest \
            --set-env-vars=NEXT_PUBLIC_APP_URL=https://visvine.com,GCS_CDN_BASE_URL=https://storage.googleapis.com/visvine-media,ENABLE_DEV_AUTH=false,TOOLS_ORIGIN=${{ vars.TOOLS_ORIGIN }},AGENT_TICK_SERVICE_ACCOUNT=${{ vars.AGENT_TICK_SERVICE_ACCOUNT }},AGENT_EDGE_URL=${{ vars.AGENT_EDGE_URL }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT }},GIT_SHA=${{ github.sha }} \
            --startup-probe=httpGet.path=/api/health,initialDelaySeconds=5,timeoutSeconds=4,periodSeconds=5,failureThreshold=12 \
            --liveness-probe=httpGet.path=/api/health,timeoutSeconds=4,periodSeconds=30,failureThreshold=3 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=1800 \
            --memory=1Gi \
            --cpu=1 \
            --port=3080 \
            --allow-unauthenticated \
            --project=${{ env.PROJECT }}

      # The gate. A candidate that cannot reach its own database, or that is
      # answering from the wrong revision, never gets traffic — the deploy fails
      # here with production still on the previous revision.
      - name: Smoke test the candidate
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "could not resolve the candidate tag URL"; exit 1
          fi
          echo "Candidate: $url"

          expected="$SERVICE-${{ steps.rel.outputs.sha8 }}"

          # Deep check: proves the revision can actually reach Cloud SQL through
          # its own service account and connector, which a shallow 200 does not.
          # Retried because a cold start plus a first connection is legitimately
          # slower than a probe interval.
          for attempt in $(seq 1 10); do
            body=$(curl -sS --max-time 20 "$url/api/health?deep=1" || true)
            echo "attempt $attempt: $body"
            ok=$(echo "$body" | jq -r '.ok // false' 2>/dev/null || echo false)
            rev=$(echo "$body" | jq -r '.revision // ""' 2>/dev/null || echo "")
            if [ "$ok" = "true" ] && [ "$rev" = "$expected" ]; then
              echo "Candidate healthy and is the expected revision ($rev)."
              exit 0
            fi
            sleep 10
          done
          echo "Candidate failed its health check; refusing to route traffic."
          exit 1

      - name: Route traffic to the candidate
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --to-revisions="$SERVICE-${{ steps.rel.outputs.sha8 }}=100" \
            --remove-tags=candidate

      # ── Data the release depends on, after the traffic it depends on ────────

      # A schema migration replays on deploy; a data SHAPE change does not, and
      # this release moved every space id, node id and entity note path
      # (`community:` → `space:`, `communities/` → `spaces/`). There is no alias
      # in front of the old shape the way there was for the entity-folder
      # backfill, so the two halves cannot be far apart — but it runs AFTER the
      # traffic switch on purpose: a deploy that fails anywhere above never
      # reaches this, and the database stays consistent with the code still
      # serving. The window is the smoke test plus this step.
      #
      # The script decides for itself whether there is anything to do — it looks
      # for stored `community:` ids, types and paths and stops when it finds
      # none — so this stays here as a no-op for every later deploy and for a
      # space restored from a pre-rename dump. It is NOT idempotent without that
      # check (step 2 shuffles two namespaces through one name), which is why
      # `--force` is not passed.
      - name: Rename community → space in the data
        id: rename
        run: |
          # The schema step's proxy is probably still up on this runner, and a
          # second one would just fail to bind — so adopt the open port when
          # there is one, and wait for readiness rather than guessing at a sleep.
          if ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            ./cloud-sql-proxy --address 127.0.0.1 --port 5432 ${{ env.SQL_INSTANCE }} &
          fi
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null || { echo "proxy never came up"; exit 1; }
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.PROJECT }})
          if echo "$DB_URL" | grep -q "host=/cloudsql"; then
            DB_URL=$(echo "$DB_URL" | sed -E 's|@[^/]*/([^?]+)\?host=[^[:space:]]*|@127.0.0.1:5432/\1|')
          fi
          corepack enable && corepack prepare pnpm@10.30.2 --activate
          pnpm install --frozen-lockfile
          # The script imports lib/prisma, and Prisma 7 does not generate on
          # install — the schema-sync step above needs no client, so nothing has
          # generated one yet.
          pnpm prisma:generate
          # `--storage` moves the space media prefix (communities/<id>/ →
          # spaces/<id>/) with the rows that point at it. STORAGE_DRIVER must be
          # explicit: it falls back to the local-disk driver whenever NODE_ENV is
          # not "production", and on this runner it is unset — which the
          # local-DB guard also requires, so it stays unset.
          DATABASE_URL="$DB_URL" \
          STORAGE_DRIVER=gcs \
          GCS_MEDIA_BUCKET=${{ env.MEDIA_BUCKET }} \
            pnpm --filter @visvine/web db:rename:spaces --storage
          # A folder's child list is relative hrefs the rename does not parse.
          DATABASE_URL="$DB_URL" pnpm --filter @visvine/web db:index-notes:rebuild

      # Belt and braces. --no-traffic means a failure above normally leaves
      # production untouched, so this exists for the one case that isn't true:
      # a partially-applied traffic update. It pins traffic back to the revision
      # captured before the deploy and clears the candidate tag either way.
      # Never fires for a failed RENAME: by then traffic is already on the new
      # code, and the data is the half that is behind. Pinning back to the old
      # revision would point older code at partly-renamed rows — strictly worse
      # than leaving the new code up and finishing the rename by hand.
      - name: Roll back on failure
        if: failure() && steps.current.outputs.revision != '' && steps.rename.outcome != 'failure'
        run: |
          echo "Deploy failed — pinning traffic to ${{ steps.current.outputs.revision }}"
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --to-revisions="${{ steps.current.outputs.revision }}=100" \
            --remove-tags=candidate || true
