name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT: visvine-platform
  REGION: australia-southeast1
  REGISTRY: australia-southeast1-docker.pkg.dev
  IMAGE: australia-southeast1-docker.pkg.dev/visvine-platform/visvine/web
  SERVICE: visvine-web
  SQL_INSTANCE: visvine-platform:australia-southeast1:visvine-pgdata

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Sync database schema
        run: |
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 ${{ env.SQL_INSTANCE }} &
          sleep 5
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.PROJECT }})
          # Adapt the unix-socket prod URL (@localhost/db?host=/cloudsql/...) to the TCP proxy.
          if echo "$DB_URL" | grep -q "host=/cloudsql"; then
            DB_URL=$(echo "$DB_URL" | sed -E 's|@[^/]*/([^?]+)\?host=[^[:space:]]*|@127.0.0.1:5432/\1|')
          fi
          corepack enable && corepack prepare pnpm@10.30.2 --activate
          pnpm install --frozen-lockfile
          cd apps/web
          # 1. Repairs a migration can't express, because they depend on the data
          #    that is already there: backfill the NOT-NULL `links.pair_key`,
          #    dedup so the unique index can build, settle duplicate public space
          #    names. Also carries the pre-baseline renames, for a database that
          #    has not had them yet.
          DATABASE_URL="$DB_URL" node scripts/prod-schema-presync.mjs
          # 2. Baseline, once. A database that predates `prisma migrate` has no
          #    record of any migration; without this, deploy would try to build a
          #    schema that is already there. Marks 0_init applied and nothing
          #    else, and only when the record is empty, so it is a no-op forever
          #    after. Deleting the tracking table is what would undo it.
          DATABASE_URL="$DB_URL" node scripts/baseline-migrations.mjs
          # 3. Replay any migration prod has not run. Unlike `db push` this
          #    executes SQL that was written and reviewed, so a rename stays a
          #    rename instead of being inferred as drop + create.
          DATABASE_URL="$DB_URL" pnpm dlx prisma@7.4.0 migrate deploy
          # 4. Apply the hand-written SQL Prisma can't express (HNSW, GIN, partial
          #    expression indexes). Must run AFTER the migrations, which own every
          #    index schema.prisma does describe.
          DATABASE_URL="$DB_URL" node scripts/apply-sql-functions.mjs
          # No seeding: production data is managed in the app, never by deploys.

      - name: Build image
        run: |
          # TOOLS_ORIGIN is a build arg, not just a runtime env var: next.config.ts's
          # headers() bakes frame-src into .next/routes-manifest.json at `next build`
          # time (see Dockerfile), so it has to be here for the image to ship a
          # frame-src that can load the Tool iframe. Empty (the default, until the
          # tools.visvine.com domain mapping exists) degrades to the documented
          # same-origin fallback — see docs/tools.md's Ops runbook.
          docker build \
            --build-arg TOOLS_ORIGIN=${{ vars.TOOLS_ORIGIN }},AGENT_TICK_SERVICE_ACCOUNT=${{ vars.AGENT_TICK_SERVICE_ACCOUNT }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Verify TOOLS_ORIGIN survived the build
        if: ${{ vars.TOOLS_ORIGIN != '' }}
        env:
          TOOLS_ORIGIN: ${{ vars.TOOLS_ORIGIN }}
        run: |
          cid=$(docker create ${{ env.IMAGE }}:${{ github.sha }})
          docker cp "$cid:/app/apps/web/.next/routes-manifest.json" ./routes-manifest.json
          docker rm "$cid" >/dev/null
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('./routes-manifest.json', 'utf8'));
            const origin = process.env.TOOLS_ORIGIN;
            const entry = (manifest.headers || []).find((h) => h.source.startsWith('/:path'));
            const csp = (entry && entry.headers.find((h) => h.key === 'Content-Security-Policy')) || {};
            const frameSrc = (csp.value || '').split('; ').find((d) => d.startsWith('frame-src')) || '';
            if (!frameSrc.includes(origin)) {
              console.error('frame-src is missing TOOLS_ORIGIN ' + origin + ' in the built image: ' + JSON.stringify(frameSrc));
              process.exit(1);
            }
            console.log('frame-src bakes TOOLS_ORIGIN: ' + frameSrc);
          "

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=visvine-cloudrun@${{ env.PROJECT }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,SUPER_ADMIN_EMAILS=SUPER_ADMIN_EMAILS:latest,GCS_MEDIA_BUCKET=GCS_MEDIA_BUCKET:latest,GCS_RESOURCES_BUCKET=GCS_RESOURCES_BUCKET:latest,SECRETS_KEY=SECRETS_KEY:latest \
            --set-env-vars=NEXT_PUBLIC_APP_URL=https://visvine.com,GCS_CDN_BASE_URL=https://storage.googleapis.com/visvine-media,ENABLE_DEV_AUTH=false,TOOLS_ORIGIN=${{ vars.TOOLS_ORIGIN }},AGENT_TICK_SERVICE_ACCOUNT=${{ vars.AGENT_TICK_SERVICE_ACCOUNT }} \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=1800 \
            --memory=1Gi \
            --cpu=1 \
            --port=3080 \
            --allow-unauthenticated \
            --project=${{ env.PROJECT }}
