name: CI

# Quality + security gates. deploy.yml handles release; this runs the checks the
# AGENTS.md verification section describes on every PR and push to main so
# regressions can't merge silently.
# A change to docs or markdown alone cannot break a check, so it runs none.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A real Postgres, with pgvector, because a meaningful slice of this app is
    # rows racing each other — the agent tick's claim/reclaim CAS, the schema
    # constraints, the retrieval indexes. Those tests detect the absence of a
    # database and SKIP; without a service container they were reported as
    # skipped forever, which reads exactly like passing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visvine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Host is localhost so the tests' own local-database guard (the same one
      # scripts/guard-local-db.mjs enforces) recognises it as safe to write to.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visvine

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject committed .env files
        run: node scripts/check-no-env-committed.mjs

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.2 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma 7 does not generate on install, and the generated client is what
      # exports `Prisma`, `PrismaClient` and every model type. Without this a
      # fresh checkout fails typecheck on the imports and then on ~200 cascaded
      # implicit-any errors. No database is needed — it reads schema.prisma.
      - name: Generate Prisma client
        run: pnpm prisma:generate

      # Replays every migration into the empty service container. This is also a
      # migration test: SQL that only works against a database already carrying
      # the shape it assumes fails here, in a PR, rather than in the deploy.
      - name: Apply migrations
        run: pnpm db:migrate

      # Every platform's tokens are generated and committed; a token edited
      # without `pnpm tokens:build` leaves some app painting the old value.
      - name: Design tokens
        run: pnpm tokens:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Knip
        run: pnpm --filter @visvine/web knip

  # The desktop shell has its own typecheck, unit tests and an end-to-end run,
  # and none of them are reachable from the root scripts the web job runs — so
  # without this job it ships on nothing but local discipline.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.2 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm desktop:typecheck

      - name: Test
        run: pnpm desktop:test

  # Split from `verify` so a new advisory reports as its own red check rather
  # than hiding at the end of a job that already passed everything else.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.2 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Two gates, not a report, because they answer different questions.
      #
      # What SHIPS is held to `moderate`: the production dependency tree is
      # clean, so there is no noise floor to tolerate and anything new should
      # stop the merge.
      #
      # The WHOLE tree is held to `high`, and this is the one that is easy to
      # leave out. `--prod` cannot see a build tool, so a critical sitting in
      # electron-builder or the Prisma CLI stays invisible to it indefinitely —
      # and a compromised build tool in a repo that federates into GCP is not a
      # smaller problem than a compromised runtime dependency. Dev tooling churns
      # faster, so its floor is one notch higher to stay actionable.
      #
      # Accepted advisories live in package.json's `pnpm.auditConfig` and are
      # justified by name in docs/runbook.md, so the allowlist is reviewable in a
      # diff and a NEW finding is the only thing that turns this red.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit the whole dependency tree
        run: pnpm audit --audit-level=high
