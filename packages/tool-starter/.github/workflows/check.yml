name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # A deploy key (the tool's page in Visvine → Deploy keys) and the space
      # it pushes to, as repository secrets. Without them this checks only.
      VISVINE_TOOL_KEY: ${{ secrets.VISVINE_TOOL_KEY }}
      VISVINE_SPACE: ${{ secrets.VISVINE_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx visvine-tool check
      - if: github.ref == 'refs/heads/main' && env.VISVINE_TOOL_KEY != ''
        run: npx visvine-tool push
