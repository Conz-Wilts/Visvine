<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visvine</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--vv-color-surface); color:var(--vv-color-fg); font-family:var(--vv-font-family-ui); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--vv-color-brand); }
  .deep { fill:var(--vv-color-accent-strong); }
  .ink { fill:var(--vv-color-fg); }
  .tint { fill:var(--vv-color-accent-soft); }
  .blk { rx:var(--vv-radius-xl); }
  .on-dark { stroke:var(--vv-color-fg-inverse); fill:none; }
  .on-dark.dot { fill:var(--vv-color-fg-inverse); stroke:none; }
  .on-tint { stroke:var(--vv-color-accent-strong); fill:none; }
  .on-tint.dot { fill:var(--vv-color-accent-strong); stroke:none; }
  .ring { stroke-width:4; }
  .link { stroke-width:6; stroke-linecap:round; }
  .words { position:absolute; left:var(--vv-space-8); bottom:var(--vv-space-8); max-width:440px; }
  .name { margin:0; font-family:var(--vv-font-family-brand); font-size:96px; line-height:.92; font-weight:900; letter-spacing:-.01em; color:var(--vv-color-fg); }
  .tag { margin:var(--vv-space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--vv-color-fg-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      vv-color-brand 208×248 bled off the top; vv-color-accent-strong 144×128 bled off the top;
              vv-color-fg 144×200 bled off the bottom; vv-color-accent-soft 96×288 bled off the right
  arrangement a tall brand slab with two stacked satellites and a tint band on the edge, gaps of vv-space-4
  pattern     ringed nodes joined by links: the mark's own vocabulary (a ring, a dot, a bar), because the
              brand is a graph of people and spaces; 9 nodes, 5 links, rings 4 and links 6 as in the mark
  scales      grid pitch vv-space-12 (48), gaps vv-space-4 (16), corners vv-radius-xl (12)
-->
  <rect class="brand blk" x="16" y="-24" width="208" height="248"/>
  <rect class="deep blk" x="240" y="-24" width="144" height="128"/>
  <rect class="ink blk" x="240" y="120" width="144" height="200"/>
  <rect class="tint blk" x="400" y="0" width="96" height="288"/>

  <line class="on-dark link" x1="72" y1="56" x2="168" y2="104"/>
  <line class="on-dark link" x1="168" y1="104" x2="88" y2="176"/>
  <line class="on-dark link" x1="288" y1="168" x2="336" y2="248"/>
  <line class="on-tint link" x1="448" y1="72" x2="448" y2="168"/>
  <line class="on-tint link" x1="448" y1="168" x2="440" y2="248"/>

  <circle class="on-dark ring" cx="72" cy="56" r="14"/><circle class="on-dark dot" cx="72" cy="56" r="7"/>
  <circle class="on-dark ring" cx="168" cy="104" r="14"/><circle class="on-dark dot" cx="168" cy="104" r="7"/>
  <circle class="on-dark ring" cx="88" cy="176" r="14"/><circle class="on-dark dot" cx="88" cy="176" r="7"/>
  <circle class="on-dark ring" cx="312" cy="40" r="14"/><circle class="on-dark dot" cx="312" cy="40" r="7"/>
  <circle class="on-dark ring" cx="288" cy="168" r="14"/><circle class="on-dark dot" cx="288" cy="168" r="7"/>
  <circle class="on-dark ring" cx="336" cy="248" r="14"/><circle class="on-dark dot" cx="336" cy="248" r="7"/>
  <circle class="on-tint ring" cx="448" cy="72" r="14"/><circle class="on-tint dot" cx="448" cy="72" r="7"/>
  <circle class="on-tint ring" cx="448" cy="168" r="14"/><circle class="on-tint dot" cx="448" cy="168" r="7"/>
  <circle class="on-tint ring" cx="440" cy="248" r="14"/><circle class="on-tint dot" cx="440" cy="248" r="7"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Visvine</h1>
  <p class="tag">Relationship context for every space.</p>
</div>
</div>
</body>
</html>
